name: spendline
description: Type "pay for lunch 500" and it lands as a clean row in your Google Sheet.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  # On-device AI (optional feature, see lib/services/smart_parser.dart)
  flutter_edge_ai: ^2.3.2
  flutter_edge_ai_litertlm: ^1.13.3
  google_sign_in: ^7.2.0
  sqflite: ^2.4.4+2
  path: ^1.9.1
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  url_launcher: ^6.3.3
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0F8F7C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0F8F7C"
  image: assets/icon/icon_foreground.png
  color_dark: "#0B2B26"
  image_dark: assets/icon/icon_foreground.png
  android_12:
    color: "#0F8F7C"
    color_dark: "#0B2B26"
    image: assets/icon/icon_foreground.png
    icon_background_color: "#0F8F7C"
    icon_background_color_dark: "#0B2B26"
